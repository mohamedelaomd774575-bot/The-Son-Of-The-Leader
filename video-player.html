<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    <title>الدرس | ابن القائد</title>
    <link rel="icon" type="image/png" href="/son.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* ==========================================================
           TOKENS — نفس لغة iOS 26 Liquid Glass بتاعة المنصة
        ========================================================== */
        :root {
            --font: "IBM Plex Sans Arabic", "SF Arabic", -apple-system, "Segoe UI", Cairo, Tahoma, system-ui, sans-serif;
            --accent: #0a84ff;
            --accent-soft: rgba(10, 132, 255, .18);
            --bg: #000;
            --surface: rgba(255, 255, 255, .065);
            --surface-2: rgba(255, 255, 255, .11);
            --hair: rgba(255, 255, 255, .11);
            --t1: #fff;
            --t2: rgba(255, 255, 255, .68);
            --t3: rgba(255, 255, 255, .42);
            --hl: inset 0 1px 0 rgba(255, 255, 255, .16);
            --ease: cubic-bezier(.25, .8, .25, 1);
            --top: 64px;

            /* زجاج المشغّل (فوق الفيديو دايمًا داكن) */
            --g-bg: rgba(38, 38, 42, .52);
            --g-brd: rgba(255, 255, 255, .16);
            --g-hl: inset 0 1px 0 rgba(255, 255, 255, .28), inset 0 -1px 0 rgba(255, 255, 255, .04);
        }

        body.light {
            --accent: #007aff;
            --accent-soft: rgba(0, 122, 255, .12);
            --bg: #fff;
            --surface: #f5f5f7;
            --surface-2: #ebebef;
            --hair: rgba(0, 0, 0, .09);
            --t1: #111114;
            --t2: rgba(17, 17, 20, .7);
            --t3: rgba(17, 17, 20, .46);
            --hl: inset 0 1px 0 rgba(255, 255, 255, .9);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--t1);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        body.noscroll {
            overflow: hidden;
        }

        button {
            font-family: inherit;
            color: inherit;
            border: 0;
            background: none;
            cursor: pointer;
            touch-action: manipulation;
        }

        svg {
            display: block;
            fill: currentColor;
        }

        @media print {
            body {
                display: none !important;
            }
        }

        /* ==========================================================
           PAGE CHROME
        ========================================================== */
        .app {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 clamp(10px, 2.4vw, 28px) calc(24px + env(safe-area-inset-bottom));
        }

        .bar {
            height: var(--top);
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: env(safe-area-inset-top);
            box-sizing: content-box;
        }

        .circle {
            width: 42px;
            height: 42px;
            flex: none;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--surface-2);
            box-shadow: var(--hl);
            transition: transform .2s var(--ease), background .2s var(--ease);
        }

        .circle:active {
            transform: scale(.92);
        }

        .circle svg {
            width: 20px;
            height: 20px;
        }

        .bar-title {
            flex: 1;
            min-width: 0;
        }

        .bar-title h1 {
            font-size: clamp(.95rem, 2.6vw, 1.12rem);
            font-weight: 700;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-title span {
            display: block;
            font-size: .74rem;
            color: var(--t3);
            margin-top: 1px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 5px 5px 14px;
            border-radius: 999px;
            background: var(--surface);
            box-shadow: var(--hl);
            font-size: .82rem;
            font-weight: 500;
            max-width: 46%;
        }

        .chip .nm {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chip .av {
            width: 30px;
            height: 30px;
            flex: none;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: .85rem;
        }

        /* ==========================================================
           STAGE (المشغّل نفسه)
        ========================================================== */
        .stage {
            --pad: clamp(8px, 2.2cqw, 18px);
            position: relative;
            width: min(100%, calc((100vh - var(--top) - 28px) * 16 / 9));
            width: min(100%, calc((100dvh - var(--top) - env(safe-area-inset-top) - 28px) * 16 / 9));
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            background: #000;
            border-radius: clamp(14px, 2.4vw, 26px);
            overflow: hidden;
            container-type: inline-size;
            isolation: isolate;
            box-shadow: 0 18px 60px rgba(0, 0, 0, .55), 0 0 0 1px var(--hair);
            direction: ltr;
            outline: none;
            -webkit-user-select: none;
            user-select: none;
            color: #fff;
        }

        .stage:fullscreen,
        .stage:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            aspect-ratio: auto;
            border-radius: 0;
            box-shadow: none;
        }

        .stage.pfs {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: none;
            aspect-ratio: auto;
            border-radius: 0;
            z-index: 9999;
            box-shadow: none;
        }

        .yt-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #000;
            z-index: 1;
        }

        /* الـ iframe بيتحجّم بالـ JS: بيكبر فوق وتحت الفيديو عشان أي شريط ليوتيوب يخرج بره الإطار */
        .yt-clip iframe {
            position: absolute;
            border: 0;
            pointer-events: none !important;
            max-width: none;
        }

        .wm {
            position: absolute;
            inset: 0;
            z-index: 8;
            pointer-events: none;
            overflow: hidden;
        }

        .wm i {
            position: absolute;
            font-style: normal;
            font-weight: 700;
            font-size: clamp(.7rem, 2.3cqw, 1.05rem);
            letter-spacing: .06em;
            white-space: nowrap;
            color: rgba(255, 255, 255, .34);
            text-shadow: 0 1px 6px rgba(0, 0, 0, .8);
            transform: rotate(-14deg);
            transition: left 1.6s var(--ease), top 1.6s var(--ease);
            direction: rtl;
        }

        .surface {
            position: absolute;
            inset: 0;
            z-index: 10;
            touch-action: manipulation;
        }

        /* زجاج */
        .glass {
            background: var(--g-bg);
            border: 1px solid var(--g-brd);
            box-shadow: var(--g-hl), 0 8px 30px rgba(0, 0, 0, .35);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            backdrop-filter: blur(26px) saturate(180%);
        }

        /* ---------- الغلاف (قبل التشغيل / بعد الانتهاء / الخطأ) ---------- */
        .cover {
            position: absolute;
            inset: 0;
            z-index: 22;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2.4cqw, 18px);
            padding: 20px;
            text-align: center;
            direction: rtl;
            background:
                radial-gradient(120% 90% at 50% 0%, rgba(10, 132, 255, .30), transparent 60%),
                radial-gradient(90% 70% at 85% 100%, rgba(94, 92, 230, .22), transparent 60%),
                #050507;
            transition: opacity .45s var(--ease), visibility .45s;
        }

        .cover.off {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cover h2 {
            font-size: clamp(.95rem, 3.4cqw, 1.5rem);
            font-weight: 700;
            line-height: 1.45;
            max-width: 80%;
        }

        .cover p {
            font-size: clamp(.75rem, 2.2cqw, .95rem);
            color: rgba(255, 255, 255, .62);
            max-width: 80%;
            line-height: 1.6;
        }

        .big-play {
            width: clamp(60px, 13cqw, 96px);
            height: clamp(60px, 13cqw, 96px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            transition: transform .25s var(--ease);
        }

        .big-play svg {
            width: 42%;
            height: 42%;
        }

        .big-play:active {
            transform: scale(.93);
        }

        .pill-btn {
            padding: 10px 22px;
            border-radius: 999px;
            font-weight: 600;
            font-size: .9rem;
            color: #fff;
        }

        .cover .ico-err {
            width: clamp(34px, 7cqw, 52px);
            height: clamp(34px, 7cqw, 52px);
            color: #ff6961;
        }

        /* ---------- spinner ---------- */
        .spinner {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 12;
            width: clamp(34px, 7cqw, 50px);
            height: clamp(34px, 7cqw, 50px);
            margin: calc(clamp(34px, 7cqw, 50px) / -2) 0 0 calc(clamp(34px, 7cqw, 50px) / -2);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .22);
            border-top-color: #fff;
            animation: spin .8s linear infinite;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }

        .spinner.on {
            opacity: 1;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- seek ripple ---------- */
        .fx {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 34%;
            z-index: 15;
            display: grid;
            place-items: center;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(closest-side, rgba(255, 255, 255, .22), transparent);
            font-weight: 700;
            font-size: clamp(.8rem, 2.6cqw, 1.05rem);
        }

        .fx.l {
            left: 0;
        }

        .fx.r {
            right: 0;
        }

        .fx.pop {
            animation: pop .6s var(--ease);
        }

        @keyframes pop {
            0% {
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        /* ---------- الواجهة (controls) ---------- */
        .ui {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s var(--ease);
            background:
                linear-gradient(to bottom, rgba(0, 0, 0, .45), transparent 22%),
                linear-gradient(to top, rgba(0, 0, 0, .55), transparent 38%);
        }

        .stage.show .ui,
        .stage.paused .ui {
            opacity: 1;
        }

        .stage.cov .ui {
            display: none;
        }

        .stage:not(.show):not(.paused):not(.cov) {
            cursor: none;
        }

        .toptitle {
            display: none;
            position: absolute;
            top: calc(var(--pad) + env(safe-area-inset-top));
            right: var(--pad);
            left: var(--pad);
            direction: rtl;
            font-weight: 600;
            font-size: clamp(.85rem, 2.4cqw, 1.1rem);
            text-shadow: 0 1px 8px rgba(0, 0, 0, .7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stage.isfs .toptitle {
            display: block;
        }

        .center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: clamp(16px, 8cqw, 64px);
        }

        .cbtn {
            border-radius: 50%;
            display: grid;
            place-items: center;
            pointer-events: auto;
            color: #fff;
            transition: transform .2s var(--ease);
        }

        .cbtn:active {
            transform: scale(.9);
        }

        .cbtn.sk {
            width: clamp(44px, 9cqw, 68px);
            height: clamp(44px, 9cqw, 68px);
        }

        .cbtn.pl {
            width: clamp(56px, 12cqw, 88px);
            height: clamp(56px, 12cqw, 88px);
        }

        .cbtn svg {
            width: 46%;
            height: 46%;
        }

        .cbtn.sk svg {
            width: 58%;
            height: 58%;
        }

        .dock {
            position: absolute;
            left: var(--pad);
            right: var(--pad);
            bottom: calc(var(--pad) + env(safe-area-inset-bottom));
            border-radius: clamp(18px, 4cqw, 28px);
            padding: clamp(8px, 1.6cqw, 12px) clamp(12px, 2.4cqw, 20px) clamp(6px, 1.2cqw, 10px);
            pointer-events: auto;
        }

        /* scrubber */
        .scrub {
            position: relative;
            height: 22px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }

        .track {
            position: relative;
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, .22);
            transition: height .15s var(--ease);
        }

        .scrub:hover .track,
        .scrub.drag .track {
            height: 8px;
        }

        .track .buf,
        .track .cur {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            border-radius: inherit;
        }

        .track .buf {
            background: rgba(255, 255, 255, .28);
            width: 0;
        }

        .track .cur {
            background: #fff;
            width: 0;
        }

        .knob {
            position: absolute;
            top: 50%;
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .5);
            left: 0;
            transform: scale(.0);
            transition: transform .15s var(--ease);
        }

        .scrub:hover .knob,
        .scrub.drag .knob {
            transform: scale(1);
        }

        @media (hover:none) {
            .knob {
                transform: scale(.8);
            }

            .scrub.drag .knob {
                transform: scale(1.25);
            }
        }

        .tip {
            position: absolute;
            bottom: 26px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 600;
            background: rgba(0, 0, 0, .7);
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s;
            font-variant-numeric: tabular-nums;
        }

        .scrub.drag .tip {
            opacity: 1;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .grp {
            display: flex;
            align-items: center;
            gap: clamp(2px, 1cqw, 8px);
            min-width: 0;
        }

        .ib {
            width: clamp(34px, 6.6cqw, 44px);
            height: clamp(34px, 6.6cqw, 44px);
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            flex: none;
            transition: background .2s var(--ease), transform .15s var(--ease);
        }

        .ib:hover {
            background: rgba(255, 255, 255, .14);
        }

        .ib:active {
            transform: scale(.9);
        }

        .ib svg {
            width: 55%;
            height: 55%;
        }

        .time {
            font-size: clamp(.68rem, 2cqw, .82rem);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, .88);
            white-space: nowrap;
            padding: 0 4px;
            direction: ltr;
        }

        .time b {
            color: rgba(255, 255, 255, .5);
            font-weight: 400;
        }

        .spd {
            min-width: 44px;
            height: clamp(30px, 5.6cqw, 36px);
            padding: 0 12px;
            border-radius: 999px;
            font-size: clamp(.7rem, 2cqw, .82rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: rgba(255, 255, 255, .14);
            color: #fff;
            direction: ltr;
        }

        .vol {
            -webkit-appearance: none;
            appearance: none;
            width: 0;
            opacity: 0;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, .28);
            transition: width .25s var(--ease), opacity .2s;
            outline: none;
            cursor: pointer;
        }

        .vol::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
        }

        .vol::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: 0;
            border-radius: 50%;
            background: #fff;
        }

        @media (hover:hover) and (pointer:fine) {

            .vgrp:hover .vol,
            .vol:focus {
                width: 78px;
                opacity: 1;
                margin-inline: 4px 8px;
            }
        }

        @container (max-width: 420px) {
            .vgrp {
                display: none;
            }
        }

        @container (max-width: 330px) {
            .time b {
                display: none;
            }
        }

        /* ---------- قائمة الإعدادات (bottom sheet زجاجي) ---------- */
        .menu {
            position: absolute;
            z-index: 40;
            right: var(--pad);
            bottom: calc(var(--pad) + env(safe-area-inset-bottom) + 84px);
            width: min(300px, calc(100% - var(--pad) * 2));
            max-height: calc(100% - 110px);
            overflow: auto;
            border-radius: 22px;
            padding: 6px;
            direction: rtl;
            background: rgba(34, 34, 38, .78);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px) scale(.96);
            transform-origin: bottom right;
            transition: opacity .22s var(--ease), transform .22s var(--ease), visibility .22s;
            overscroll-behavior: contain;
        }

        .menu.open {
            opacity: 1;
            visibility: visible;
            transform: none;
        }

        @media (max-height: 520px) {
            .menu {
                bottom: var(--pad);
                max-height: calc(100% - var(--pad) * 2);
            }
        }

        .mrow {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: .92rem;
            font-weight: 500;
            text-align: start;
            color: #fff;
        }

        .mrow:hover,
        .mrow:active {
            background: rgba(255, 255, 255, .1);
        }

        .mrow .v {
            margin-inline-start: auto;
            color: rgba(255, 255, 255, .55);
            font-size: .84rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mrow svg {
            width: 16px;
            height: 16px;
        }

        .mrow .ck {
            margin-inline-start: auto;
            color: var(--accent);
            opacity: 0;
        }

        .mrow.sel .ck {
            opacity: 1;
        }

        .mhead {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px 6px;
            font-weight: 700;
            font-size: .88rem;
            color: rgba(255, 255, 255, .9);
        }

        .mhead button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .12);
            color: #fff;
        }

        .mhead svg {
            width: 14px;
            height: 14px;
        }

        .mnote {
            padding: 6px 14px 10px;
            font-size: .74rem;
            color: rgba(255, 255, 255, .45);
            line-height: 1.6;
        }

        /* ---------- toast ---------- */
        .toast {
            position: absolute;
            z-index: 50;
            top: calc(var(--pad) + env(safe-area-inset-top));
            left: 50%;
            transform: translate(-50%, -14px);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: clamp(.72rem, 2.1cqw, .85rem);
            font-weight: 600;
            direction: rtl;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity .25s var(--ease), transform .25s var(--ease);
        }

        .toast.on {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ---------- قفل (DevTools) ---------- */
        .lock {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            direction: rtl;
            font-weight: 600;
            background: rgba(0, 0, 0, .55);
            -webkit-backdrop-filter: blur(40px);
            backdrop-filter: blur(40px);
        }

        .stage.locked .lock {
            display: flex;
        }

        /* ==========================================================
           INFO (تحت المشغّل)
        ========================================================== */
        .info {
            max-width: min(100%, 1280px);
            margin: 16px auto 0;
            display: grid;
            gap: 12px;
        }

        .card {
            background: var(--surface);
            box-shadow: var(--hl);
            border-radius: 22px;
            padding: clamp(14px, 3vw, 22px);
        }

        .card h2 {
            font-size: clamp(1.02rem, 2.8vw, 1.3rem);
            font-weight: 700;
            line-height: 1.5;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--surface-2);
            font-size: .78rem;
            font-weight: 500;
            color: var(--t2);
        }

        .tag svg {
            width: 14px;
            height: 14px;
            color: var(--accent);
        }

        .keys {
            display: none;
            font-size: .8rem;
            color: var(--t3);
            line-height: 2;
        }

        .keys kbd {
            font-family: inherit;
            padding: 1px 8px;
            border-radius: 7px;
            background: var(--surface-2);
            color: var(--t2);
            margin-inline: 2px;
        }

        @media (hover:hover) and (pointer:fine) {
            .keys {
                display: block;
            }
        }

        /* موبايل أفقي / شاشات قصيرة: المشغّل ياخد الشاشة */
        @media (orientation: landscape) and (max-height: 520px) {
            :root {
                --top: 48px;
            }

            .app {
                padding-bottom: 8px;
            }

            .circle {
                width: 36px;
                height: 36px;
            }

            .stage {
                width: 100%;
                aspect-ratio: auto;
                height: calc(100vh - var(--top) - 12px);
                height: calc(100dvh - var(--top) - env(safe-area-inset-top) - 12px);
                border-radius: 18px;
            }

            .info {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .chip {
                padding-left: 5px;
                max-width: 42%;
            }

            .chip .nm {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <header class="bar">
            <button class="circle" id="backBtn" aria-label="رجوع">
                <svg viewBox="0 0 24 24">
                    <path d="M9.3 5.3a1 1 0 0 0 0 1.4l5.3 5.3-5.3 5.3a1 1 0 1 0 1.4 1.4l6-6a1 1 0 0 0 0-1.4l-6-6a1 1 0 0 0-1.4 0z" />
                </svg>
            </button>
            <div class="bar-title">
                <h1 id="lessonTitle">جاري التحميل…</h1>
                <span>ابن القائد</span>
            </div>
            <div class="chip" id="studentChip">
                <span class="nm" id="stuName"></span>
                <span class="av" id="stuAv">ط</span>
            </div>
        </header>

        <main>
            <section class="stage" id="stage" tabindex="0" aria-label="مشغل الفيديو">

                <div class="yt-clip" id="ytClip">
                    <div id="ytMount"></div>
                </div>

                <div class="wm" id="wm"></div>

                <div class="spinner" id="spinner"></div>
                <div class="surface" id="surface"></div>
                <div class="fx l" id="fxL">‎−10</div>
                <div class="fx r" id="fxR">+10</div>

                <!-- الواجهة -->
                <div class="ui" id="ui">
                    <div class="toptitle" id="topTitle"></div>

                    <div class="center">
                        <button class="cbtn sk glass" id="bBack" aria-label="رجوع 10 ثواني">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 5V2.2a.5.5 0 0 0-.8-.4L7 5.3a.5.5 0 0 0 0 .8l4.2 3.5a.5.5 0 0 0 .8-.4V6.5A6.5 6.5 0 1 1 5.5 13a1 1 0 1 0-2 0A8.5 8.5 0 1 0 12 5z" />
                                <text x="12" y="16.4" font-size="6.6" font-weight="700" text-anchor="middle" font-family="sans-serif">10</text>
                            </svg>
                        </button>
                        <button class="cbtn pl glass" id="bCenter" aria-label="تشغيل / إيقاف"></button>
                        <button class="cbtn sk glass" id="bFwd" aria-label="تقديم 10 ثواني">
                            <svg viewBox="0 0 24 24" style="transform:scaleX(-1)">
                                <path d="M12 5V2.2a.5.5 0 0 0-.8-.4L7 5.3a.5.5 0 0 0 0 .8l4.2 3.5a.5.5 0 0 0 .8-.4V6.5A6.5 6.5 0 1 1 5.5 13a1 1 0 1 0-2 0A8.5 8.5 0 1 0 12 5z" />
                            </svg>
                            <span style="position:absolute;font-size:.62em;font-weight:700;margin-top:1px">10</span>
                        </button>
                    </div>

                    <div class="dock glass" id="dock">
                        <div class="scrub" id="scrub">
                            <div class="track">
                                <div class="buf" id="sBuf"></div>
                                <div class="cur" id="sCur"></div>
                                <div class="knob" id="sKnob"></div>
                            </div>
                            <div class="tip" id="sTip">0:00</div>
                        </div>
                        <div class="row">
                            <div class="grp">
                                <button class="ib" id="bPlay" aria-label="تشغيل / إيقاف"></button>
                                <div class="grp vgrp">
                                    <button class="ib" id="bMute" aria-label="كتم"></button>
                                    <input class="vol" id="vol" type="range" min="0" max="100" value="100" aria-label="الصوت">
                                </div>
                                <div class="time" id="time">0:00 <b>/ 0:00</b></div>
                            </div>
                            <div class="grp">
                                <button class="spd" id="bSpd" aria-label="السرعة">1×</button>
                                <button class="ib" id="bSet" aria-label="الإعدادات"></button>
                                <button class="ib" id="bFs" aria-label="ملء الشاشة"></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="menu glass" id="menu"></div>
                <div class="toast glass" id="toast"></div>

                <!-- غلاف: بداية / نهاية / خطأ -->
                <div class="cover" id="cover"></div>

                <div class="lock">
                    <div>أغلق أدوات المطوّر عشان تكمل الدرس</div>
                </div>
            </section>

            <section class="info">
                <div class="card">
                    <h2 id="infoTitle"></h2>
                    <div class="tags">
                        <span class="tag" id="tagStu">
                            <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-8 2-8 5v1.5a.5.5 0 0 0 .5.5h15a.5.5 0 0 0 .5-.5V19c0-3-4-5-8-5z" /></svg>
                            <span id="tagStuTxt"></span>
                        </span>
                        <span class="tag">
                            <svg viewBox="0 0 24 24"><path d="M12 2 4 5.5v5.6c0 5 3.4 9.3 8 10.9 4.6-1.6 8-5.9 8-10.9V5.5L12 2zm-1.2 13.6-3-3 1.4-1.4 1.6 1.6 4-4 1.4 1.4-5.4 5.4z" /></svg>
                            محتوى محمي ببيانات حسابك
                        </span>
                    </div>
                </div>
                <div class="card keys">
                    <kbd>Space</kbd> تشغيل / إيقاف &nbsp;·&nbsp; <kbd>←</kbd><kbd>→</kbd> ±10 ثواني &nbsp;·&nbsp;
                    <kbd>↑</kbd><kbd>↓</kbd> الصوت &nbsp;·&nbsp; <kbd>M</kbd> كتم &nbsp;·&nbsp; <kbd>F</kbd> ملء الشاشة
                </div>
            </section>
        </main>
    </div>

    <script>
        (function () {
            'use strict';

            /* ======================================================
               أدوات صغيرة
            ====================================================== */
            const $ = id => document.getElementById(id);
            const stage = $('stage');

            try { if (localStorage.getItem('son-leader-theme') === 'light') document.body.classList.add('light'); } catch (e) { }

            // ---- أيقونات SVG (من غير أي مكتبة خارجية) ----
            const I = {
                play: '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>',
                pause: '<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg>',
                vol: '<svg viewBox="0 0 24 24"><path d="M3 9.5v5a1 1 0 0 0 1 1h3l4.3 3.6a1 1 0 0 0 1.7-.77V5.67a1 1 0 0 0-1.7-.77L7 8.5H4a1 1 0 0 0-1 1z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
                mute: '<svg viewBox="0 0 24 24"><path d="M3 9.5v5a1 1 0 0 0 1 1h3l4.3 3.6a1 1 0 0 0 1.7-.77V5.67a1 1 0 0 0-1.7-.77L7 8.5H4a1 1 0 0 0-1 1z"/><path d="m16 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
                gear: '<svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.4 7.4 0 0 0-1.7-1l-.4-2.5a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6l2 1.6a7.7 7.7 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.5c0 .2.2.4.5.4h3.8c.3 0 .5-.2.5-.4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6l-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>',
                fs: '<svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
                fsx: '<svg viewBox="0 0 24 24"><path d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4M20 9h-3.5A1.5 1.5 0 0 1 15 7.5V4M15 20v-3.5a1.5 1.5 0 0 1 1.5-1.5H20M4 15h3.5A1.5 1.5 0 0 1 9 16.5V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
                chev: '<svg viewBox="0 0 24 24"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.4 12l5.3 5.3a1 1 0 0 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0z"/></svg>',
                chevr: '<svg viewBox="0 0 24 24"><path d="M9.3 5.3a1 1 0 0 0 0 1.4l5.3 5.3-5.3 5.3a1 1 0 1 0 1.4 1.4l6-6a1 1 0 0 0 0-1.4l-6-6a1 1 0 0 0-1.4 0z"/></svg>',
                check: '<svg viewBox="0 0 24 24"><path d="M9.5 17.2 4.8 12.5l1.4-1.4 3.3 3.3 8.3-8.3 1.4 1.4z"/></svg>',
                replay: '<svg viewBox="0 0 24 24"><path d="M12 5V2.2a.5.5 0 0 0-.8-.4L7 5.3a.5.5 0 0 0 0 .8l4.2 3.5a.5.5 0 0 0 .8-.4V7a5.5 5.5 0 1 1-5.5 5.5 1 1 0 1 0-2 0A7.5 7.5 0 1 0 12 5z"/></svg>',
                warn: '<svg class="ico-err" viewBox="0 0 24 24"><path d="M12 2.5a1.6 1.6 0 0 1 1.4.8l9 15.6a1.6 1.6 0 0 1-1.4 2.4H3a1.6 1.6 0 0 1-1.4-2.4l9-15.6A1.6 1.6 0 0 1 12 2.5zm-1 6.5v5h2V9h-2zm0 7v2h2v-2h-2z"/></svg>'
            };

            /* ======================================================
               سياق الدرس — الرابط بيتفك مرة واحدة، وبيتشال من شريط العنوان
               ومن الـ history، وبيفضل جوه الـ closure بس (مش global)
            ====================================================== */
            function mask(s) { try { return btoa(unescape(encodeURIComponent(s))).split('').reverse().join(''); } catch (e) { return ''; } }
            function unmask(s) {
                try {
                    if (!s) return '';
                    if (/^https?:/i.test(s)) return s;
                    return decodeURIComponent(escape(atob(s.split('').reverse().join(''))));
                } catch (e) { return ''; }
            }
            function ytId(u) {
                if (!u) return '';
                if (/^[\w-]{11}$/.test(u)) return u;
                const m = u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
                return m ? m[1] : '';
            }

            let ctx = null;
            (function loadCtx() {
                const q = new URLSearchParams(location.search);
                if (q.has('url') || q.has('videoId')) {
                    const vid = ytId(q.get('videoId') || '') || ytId(unmask(q.get('url') || ''));
                    ctx = { c: q.get('courseId') || '', t: q.get('title') || '', v: vid };
                    try { sessionStorage.setItem('vp_ctx', JSON.stringify({ c: ctx.c, t: ctx.t, k: mask(vid) })); } catch (e) { }
                    try { history.replaceState(null, '', location.pathname); } catch (e) { }
                } else {
                    try {
                        const s = JSON.parse(sessionStorage.getItem('vp_ctx') || 'null');
                        if (s) ctx = { c: s.c, t: s.t, v: ytId(unmask(s.k)) };
                    } catch (e) { }
                }
            })();

            const TITLE = (ctx && ctx.t) || 'الدرس';
            $('lessonTitle').textContent = TITLE;
            $('infoTitle').textContent = TITLE;
            $('topTitle').textContent = TITLE;
            document.title = TITLE + ' | ابن القائد';

            /* ---- الطالب ---- */
            const student = (function () {
                for (const k of ['studentData', 'leader_user', 'userData', 'student']) {
                    try {
                        const raw = localStorage.getItem(k);
                        if (!raw || raw[0] !== '{') continue;
                        const o = JSON.parse(raw);
                        const name = o.name || o.studentName || o.fullName || '';
                        const phone = (o.phone || o.studentPhone || o.mobile || '').toString().replace(/\D/g, '');
                        if (name || phone) return { name: name || 'طالب', phone };
                    } catch (e) { }
                }
                return { name: 'طالب', phone: '' };
            })();
            $('stuName').textContent = student.name;
            $('stuAv').textContent = (student.name.trim().charAt(0)) || 'ط';
            $('tagStuTxt').textContent = student.name;

            /* ======================================================
               أيقونات الأزرار
            ====================================================== */
            const bCenter = $('bCenter'), bPlay = $('bPlay'), bMute = $('bMute'), bSet = $('bSet'), bFs = $('bFs');
            bSet.innerHTML = I.gear;
            bFs.innerHTML = I.fs;
            bMute.innerHTML = I.vol;

            /* ======================================================
               الغلاف (cover)
            ====================================================== */
            const cover = $('cover');
            let coverMode = 'start';
            function setCover(mode) {
                coverMode = mode;
                stage.classList.toggle('cov', mode !== 'off');
                if (mode === 'off') { cover.classList.add('off'); return; }
                cover.classList.remove('off');
                if (mode === 'start') {
                    cover.innerHTML = '<button class="big-play glass" id="cvPlay" aria-label="تشغيل">' + I.play + '</button><h2></h2>';
                    cover.querySelector('h2').textContent = TITLE;
                    $('cvPlay').onclick = e => { e.stopPropagation(); play(); };
                } else if (mode === 'end') {
                    cover.innerHTML = '<button class="big-play glass" id="cvPlay" aria-label="إعادة">' + I.replay + '</button><h2>انتهى الدرس</h2><p>اضغط لإعادة المشاهدة</p>';
                    $('cvPlay').onclick = e => { e.stopPropagation(); seek(0); play(); };
                } else if (mode === 'load') {
                    cover.innerHTML = '<h2>جاري تجهيز الدرس…</h2>';
                } else if (mode === 'err') {
                    cover.innerHTML = I.warn + '<h2>تعذّر تشغيل الفيديو</h2><p id="errMsg"></p><button class="pill-btn glass" id="cvRetry">إعادة المحاولة</button>';
                    $('errMsg').textContent = cover.dataset.msg || 'تأكد من اتصالك بالإنترنت وجرّب تاني. لو المشكلة فضلت كلّم الدعم.';
                    $('cvRetry').onclick = e => { e.stopPropagation(); location.reload(); };
                }
            }

            /* ======================================================
               مشغّل YouTube (بدون أي واجهة من يوتيوب)
            ====================================================== */
            let yt = null, ready = false, dur = 0, st = -2, speed = 1;
            let started = false, dragging = false, tickTimer = null, lastSave = 0;
            let ifr = null;

            const POS_KEY = 'vp_pos_' + ((ctx && ctx.c) || (ctx && ctx.v) || 'x');

            function fitFrame() {
                if (!ifr) return;
                const w = stage.clientWidth, h = stage.clientHeight;
                if (!w || !h) return;
                const vh = Math.min(h, w * 9 / 16), vw = vh * 16 / 9, e = 80;
                ifr.style.width = Math.ceil(vw) + 'px';
                ifr.style.height = Math.ceil(vh + e * 2) + 'px';
                ifr.style.left = Math.floor((w - vw) / 2) + 'px';
                ifr.style.top = Math.floor((h - vh) / 2 - e) + 'px';
            }
            new ResizeObserver(fitFrame).observe(stage);

            function loadAPI() {
                return new Promise((res, rej) => {
                    if (window.YT && YT.Player) return res();
                    const prev = window.onYouTubeIframeAPIReady;
                    window.onYouTubeIframeAPIReady = () => { try { prev && prev(); } catch (e) { } res(); };
                    const s = document.createElement('script');
                    s.src = 'https://www.youtube.com/iframe_api';
                    s.onerror = () => rej(new Error('net'));
                    document.head.appendChild(s);
                    setTimeout(() => { if (!(window.YT && YT.Player)) rej(new Error('timeout')); }, 15000);
                });
            }

            function init() {
                if (!ctx || !ctx.v) {
                    cover.dataset.msg = 'مفيش فيديو متاح للدرس ده. كلّم الإدارة.';
                    setCover('err');
                    $('cvRetry') && ($('cvRetry').style.display = 'none');
                    return;
                }
                setCover('load');
                loadAPI().then(() => {
                    const vars = { controls: 0, disablekb: 1, fs: 0, modestbranding: 1, rel: 0, iv_load_policy: 3, cc_load_policy: 0, playsinline: 1, enablejsapi: 1, autoplay: 0 };
                    if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
                    yt = new YT.Player('ytMount', {
                        host: 'https://www.youtube-nocookie.com',
                        width: '100%', height: '100%', videoId: ctx.v, playerVars: vars,
                        events: { onReady, onStateChange, onError, onPlaybackRateChange: () => { try { speed = yt.getPlaybackRate(); $('bSpd').textContent = fmtSpeed(speed); } catch (e) { } } }
                    });
                }).catch(() => { cover.dataset.msg = 'تعذّر الاتصال بخدمة الفيديو. تأكد من الإنترنت.'; setCover('err'); });
            }

            function onReady() {
                ready = true;
                ifr = stage.querySelector('iframe');
                if (ifr) {
                    ifr.removeAttribute('title');
                    ifr.setAttribute('tabindex', '-1');
                    ifr.setAttribute('aria-hidden', 'true');
                    ifr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
                }
                fitFrame();
                try { dur = yt.getDuration() || 0; } catch (e) { }
                try { const v = yt.getVolume(); $('vol').value = v; } catch (e) { }
                setCover('start');
                renderPlayIcons();
                tick();
            }

            function onStateChange(e) {
                st = e.data;
                if (st === 1) {            // playing
                    started = true;
                    setCover('off');
                    spin(false);
                    stage.classList.remove('paused');
                    try { dur = yt.getDuration() || dur; } catch (_) { }
                    if (!resumed) { resumed = true; resumeFromSaved(); }
                    startTick();
                    showUI();
                } else if (st === 2) {     // paused
                    stage.classList.add('paused');
                    spin(false);
                    stopTick(); tick(); saveNow();
                } else if (st === 3) {     // buffering
                    if (started) spin(true);
                } else if (st === 0) {     // ended
                    stopTick(); tick();
                    try { localStorage.removeItem(POS_KEY); } catch (_) { }
                    stage.classList.remove('paused');
                    setCover('end');
                    closeMenu();
                }
                renderPlayIcons();
            }

            function onError(e) {
                const c = e.data;
                cover.dataset.msg = (c === 100 || c === 105)
                    ? 'الفيديو ده مش متاح حاليًا. كلّم الإدارة.'
                    : 'الفيديو مش بيشتغل هنا حاليًا. جرّب تاني بعد شوية.';
                setCover('err');
                spin(false);
            }

            let resumed = false;
            function resumeFromSaved() {
                try {
                    const t = parseFloat(localStorage.getItem(POS_KEY) || '0');
                    if (t > 8 && dur && t < dur - 12) { seek(t); toast('كملنا من آخر مكان وقفت عنده'); }
                } catch (e) { }
            }

            function saveNow() {
                try { if (ready && st !== 0) { const t = yt.getCurrentTime(); if (t > 3) localStorage.setItem(POS_KEY, String(Math.floor(t))); } } catch (e) { }
            }

            /* ---------- أفعال ---------- */
            function play() { if (ready) { try { yt.playVideo(); } catch (e) { } } }
            function pause() { if (ready) { try { yt.pauseVideo(); } catch (e) { } } }
            function isPlaying() { return st === 1 || st === 3; }
            function togglePlay() { isPlaying() ? pause() : play(); }
            function seek(t) { if (!ready) return; t = Math.max(0, Math.min(dur || 1e9, t)); try { yt.seekTo(t, true); } catch (e) { } tick(t); }
            function skip(d) {
                if (!ready) return;
                let c = 0; try { c = yt.getCurrentTime(); } catch (e) { }
                seek(c + d);
                const el = d > 0 ? $('fxR') : $('fxL');
                el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
            }
            function setVol(v) { if (!ready) return; try { yt.setVolume(v); v > 0 ? yt.unMute() : yt.mute(); } catch (e) { } $('vol').value = v; renderVol(); }
            function toggleMute() { if (!ready) return; try { if (yt.isMuted()) { yt.unMute(); if (yt.getVolume() === 0) yt.setVolume(60); } else yt.mute(); } catch (e) { } renderVol(); }
            function renderVol() { try { const m = yt.isMuted() || yt.getVolume() === 0; bMute.innerHTML = m ? I.mute : I.vol; $('vol').value = m ? 0 : yt.getVolume(); } catch (e) { } }

            function renderPlayIcons() {
                const p = isPlaying();
                bCenter.innerHTML = p ? I.pause : I.play;
                bPlay.innerHTML = p ? I.pause : I.play;
            }

            function spin(on) { $('spinner').classList.toggle('on', !!on); }

            /* ---------- progress ---------- */
            const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
            const fmtSpeed = r => (r === 1 ? '1' : String(r)) + '×';

            function tick(forceT) {
                if (!ready || dragging) return;
                let c = 0, buf = 0;
                try { c = typeof forceT === 'number' ? forceT : yt.getCurrentTime(); buf = yt.getVideoLoadedFraction(); if (!dur) dur = yt.getDuration() || 0; } catch (e) { }
                const f = dur ? Math.min(1, c / dur) : 0;
                paintProgress(f, buf);
                $('time').innerHTML = fmt(c) + ' <b>/ ' + fmt(dur) + '</b>';
                if (isPlaying() && Date.now() - lastSave > 5000) { lastSave = Date.now(); saveNow(); }
            }
            function paintProgress(f, buf) {
                $('sCur').style.width = (f * 100) + '%';
                $('sBuf').style.width = ((buf || 0) * 100) + '%';
                $('sKnob').style.left = (f * 100) + '%';
            }
            function startTick() { stopTick(); tickTimer = setInterval(tick, 250); }
            function stopTick() { clearInterval(tickTimer); tickTimer = null; }

            /* ---------- scrubber (سحب بالماوس واللمس) ---------- */
            const scrub = $('scrub');
            function fracFrom(e) { const r = scrub.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); }
            function scrubMove(e) {
                const f = fracFrom(e);
                paintProgress(f, 0);
                const tip = $('sTip');
                tip.style.left = Math.max(26, Math.min(scrub.clientWidth - 26, f * scrub.clientWidth)) + 'px';
                tip.textContent = fmt(f * dur);
                $('time').innerHTML = fmt(f * dur) + ' <b>/ ' + fmt(dur) + '</b>';
                return f;
            }
            scrub.addEventListener('pointerdown', e => {
                if (!ready || !dur) return;
                dragging = true; scrub.classList.add('drag');
                scrub.setPointerCapture(e.pointerId);
                scrubMove(e); showUI(true);
            });
            scrub.addEventListener('pointermove', e => { if (dragging) scrubMove(e); });
            const endDrag = e => {
                if (!dragging) return;
                const f = fracFrom(e);
                dragging = false; scrub.classList.remove('drag');
                seek(f * dur); showUI();
            };
            scrub.addEventListener('pointerup', endDrag);
            scrub.addEventListener('pointercancel', () => { dragging = false; scrub.classList.remove('drag'); });

            /* ---------- إظهار / إخفاء الواجهة ---------- */
            let hideT = null;
            function showUI(keep) {
                stage.classList.add('show');
                clearTimeout(hideT);
                if (!keep) hideT = setTimeout(() => { if (isPlaying() && !menuOpen && !dragging) stage.classList.remove('show'); }, 3200);
            }
            function hideUI() { if (isPlaying() && !menuOpen) stage.classList.remove('show'); }
            stage.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') showUI(); });
            stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideT = setTimeout(hideUI, 800); });
            $('ui').addEventListener('pointerdown', () => showUI());

            /* ---------- النقر على الشاشة ---------- */
            let lastTap = 0, tapT = null;
            $('surface').addEventListener('pointerup', e => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                if (coverMode !== 'off') return;
                if (menuOpen) { closeMenu(); return; }
                const now = Date.now();
                const r = stage.getBoundingClientRect();
                const x = (e.clientX - r.left) / r.width;
                if (now - lastTap < 300) {
                    clearTimeout(tapT);
                    if (e.pointerType === 'mouse') { lastTap = 0; toggleFS(); }
                    else {
                        lastTap = now;
                        if (x < .38) skip(-10); else if (x > .62) skip(10);
                    }
                    return;
                }
                lastTap = now;
                tapT = setTimeout(() => {
                    if (e.pointerType === 'mouse') { togglePlay(); showUI(); }
                    else { stage.classList.contains('show') ? (isPlaying() ? stage.classList.remove('show') : 0) : showUI(); }
                }, 290);
            });

            /* ---------- الأزرار ---------- */
            bCenter.onclick = e => { e.stopPropagation(); togglePlay(); showUI(); };
            bPlay.onclick = e => { e.stopPropagation(); togglePlay(); showUI(); };
            $('bBack').onclick = e => { e.stopPropagation(); skip(-10); showUI(); };
            $('bFwd').onclick = e => { e.stopPropagation(); skip(10); showUI(); };
            bMute.onclick = e => { e.stopPropagation(); toggleMute(); };
            $('vol').addEventListener('input', e => setVol(parseInt(e.target.value, 10)));
            bFs.onclick = e => { e.stopPropagation(); toggleFS(); };
            bSet.onclick = e => { e.stopPropagation(); menuOpen ? closeMenu() : openMenu('main'); };
            $('bSpd').onclick = e => { e.stopPropagation(); menuOpen && menuPage === 'speed' ? closeMenu() : openMenu('speed'); };
            $('menu').addEventListener('pointerdown', e => e.stopPropagation());
            $('dock').addEventListener('pointerdown', e => e.stopPropagation());

            /* ---------- ملء الشاشة (مع بديل لـ iPhone) ---------- */
            function isFS() { return document.fullscreenElement === stage || document.webkitFullscreenElement === stage || stage.classList.contains('pfs'); }
            function updateFS() {
                const f = isFS();
                bFs.innerHTML = f ? I.fsx : I.fs;
                stage.classList.toggle('isfs', f);
                setTimeout(fitFrame, 60);
            }
            async function toggleFS() {
                if (isFS()) {
                    if (stage.classList.contains('pfs')) { stage.classList.remove('pfs'); document.body.classList.remove('noscroll'); }
                    else if (document.exitFullscreen) { try { await document.exitFullscreen(); } catch (e) { } }
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) { }
                } else {
                    try {
                        if (stage.requestFullscreen) await stage.requestFullscreen({ navigationUI: 'hide' });
                        else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
                        else throw new Error('nofs');
                        try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => { }); } catch (e) { }
                    } catch (e) {
                        stage.classList.add('pfs'); document.body.classList.add('noscroll');
                    }
                }
                updateFS(); showUI();
            }
            document.addEventListener('fullscreenchange', updateFS);
            document.addEventListener('webkitfullscreenchange', updateFS);

            /* ---------- قائمة الإعدادات ---------- */
            const menu = $('menu');
            let menuOpen = false, menuPage = 'main';
            const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
            const QLBL = { highres: '4K+', hd2160: '4K', hd1440: '1440p', hd1080: '1080p', hd720: '720p', large: '480p', medium: '360p', small: '240p', tiny: '144p', auto: 'تلقائي' };
            let curQ = 'auto';

            function openMenu(page) { menuPage = page; renderMenu(); menu.classList.add('open'); menuOpen = true; showUI(true); }
            function closeMenu() { menu.classList.remove('open'); menuOpen = false; showUI(); }

            function renderMenu() {
                let h = '';
                if (menuPage === 'main') {
                    h += '<button class="mrow" data-go="speed"><span>سرعة التشغيل</span><span class="v">' + fmtSpeed(speed) + I.chev + '</span></button>';
                    h += '<button class="mrow" data-go="quality"><span>الجودة</span><span class="v">' + (QLBL[curQ] || curQ) + I.chev + '</span></button>';
                } else if (menuPage === 'speed') {
                    h += '<div class="mhead"><button data-go="main" aria-label="رجوع">' + I.chevr + '</button>سرعة التشغيل</div>';
                    SPEEDS.forEach(s => { h += '<button class="mrow' + (s === speed ? ' sel' : '') + '" data-speed="' + s + '"><span>' + (s === 1 ? 'عادية' : fmtSpeed(s)) + '</span><span class="ck">' + I.check + '</span></button>'; });
                } else if (menuPage === 'quality') {
                    h += '<div class="mhead"><button data-go="main" aria-label="رجوع">' + I.chevr + '</button>الجودة</div>';
                    let lv = []; try { lv = (yt.getAvailableQualityLevels() || []).filter(l => l !== 'auto'); } catch (e) { }
                    if (!lv.length) h += '<div class="mnote">الجودة بتظهر بعد ما الفيديو يشتغل.</div>';
                    ['auto'].concat(lv).forEach(l => { h += '<button class="mrow' + (l === curQ ? ' sel' : '') + '" data-q="' + l + '"><span>' + (QLBL[l] || l) + '</span><span class="ck">' + I.check + '</span></button>'; });
                    h += '<div class="mnote">الجودة التلقائية بتتظبط حسب سرعة الإنترنت عندك.</div>';
                }
                menu.innerHTML = h;
                menu.querySelectorAll('[data-go]').forEach(b => b.onclick = e => { e.stopPropagation(); menuPage = b.dataset.go; renderMenu(); });
                menu.querySelectorAll('[data-speed]').forEach(b => b.onclick = e => {
                    e.stopPropagation();
                    speed = parseFloat(b.dataset.speed);
                    try { yt.setPlaybackRate(speed); } catch (_) { }
                    $('bSpd').textContent = fmtSpeed(speed);
                    toast('السرعة ' + fmtSpeed(speed)); closeMenu();
                });
                menu.querySelectorAll('[data-q]').forEach(b => b.onclick = e => {
                    e.stopPropagation();
                    const q = b.dataset.q; curQ = q;
                    try { yt.setPlaybackQuality(q); if (q !== 'auto' && yt.setPlaybackQualityRange) yt.setPlaybackQualityRange(q, q); } catch (_) { }
                    closeMenu();
                    if (q !== 'auto') {
                        setTimeout(() => {
                            let now = ''; try { now = yt.getPlaybackQuality(); } catch (_) { }
                            if (now && now !== q) { curQ = 'auto'; toast('الجودة بتتحدد تلقائي حسب اتصالك'); }
                            else toast('الجودة ' + (QLBL[q] || q));
                        }, 1600);
                    } else toast('الجودة تلقائية');
                });
            }

            /* ---------- toast ---------- */
            let toastT = null;
            function toast(msg) {
                const t = $('toast'); t.textContent = msg; t.classList.add('on');
                clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1900);
            }

            /* ---------- كيبورد ---------- */
            document.addEventListener('keydown', e => {
                if (!ready || coverMode === 'err') return;
                const tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' && document.activeElement.type !== 'range') return;
                const k = e.key.toLowerCase();
                const acts = {
                    ' ': () => togglePlay(), 'k': () => togglePlay(),
                    'arrowright': () => skip(10), 'l': () => skip(10),
                    'arrowleft': () => skip(-10), 'j': () => skip(-10),
                    'arrowup': () => { let v = 0; try { v = yt.getVolume(); } catch (_) { } setVol(Math.min(100, v + 10)); toast('الصوت ' + Math.min(100, v + 10) + '%'); },
                    'arrowdown': () => { let v = 0; try { v = yt.getVolume(); } catch (_) { } setVol(Math.max(0, v - 10)); toast('الصوت ' + Math.max(0, v - 10) + '%'); },
                    'm': () => toggleMute(), 'f': () => toggleFS(),
                    'escape': () => { if (menuOpen) closeMenu(); else if (stage.classList.contains('pfs')) toggleFS(); }
                };
                if (acts[k]) { e.preventDefault(); acts[k](); showUI(); }
            });

            /* ---------- علامة مائية متحركة ---------- */
            (function watermark() {
                const wm = $('wm');
                const txt = (student.name + (student.phone ? '  ' + student.phone : '')).trim();
                const nodes = [0, 1, 2].map(() => { const i = document.createElement('i'); i.textContent = txt; wm.appendChild(i); return i; });
                const place = () => nodes.forEach((n, idx) => {
                    n.style.left = (6 + Math.random() * 62) + '%';
                    n.style.top = (8 + Math.random() * 78) + '%';
                    n.style.opacity = idx === 0 ? 1 : (.55 + Math.random() * .4);
                });
                place(); setInterval(place, 8000);
            })();

            /* ======================================================
               حماية (طبقة ردع — الحماية الحقيقية على السيرفر)
            ====================================================== */
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                const c = e.ctrlKey || e.metaKey, s = e.shiftKey, k = e.key.toUpperCase();
                if (e.key === 'F12' || (c && ['U', 'S', 'P'].includes(k)) || (c && s && ['I', 'J', 'C'].includes(k))) {
                    e.preventDefault(); e.stopPropagation(); toast('الإجراء ده غير مسموح');
                }
            }, true);

            // كشف DevTools المثبّتة على الجنب (للكمبيوتر بس عشان مفيش false positives على الموبايل)
            const fine = window.matchMedia('(pointer:fine)');
            setInterval(() => {
                if (!fine.matches) return;
                const open = (window.outerWidth - window.innerWidth > 220) || (window.outerHeight - window.innerHeight > 260);
                if (open && !stage.classList.contains('locked')) { stage.classList.add('locked'); pause(); }
                else if (!open && stage.classList.contains('locked')) stage.classList.remove('locked');
            }, 1000);

            window.addEventListener('beforeunload', saveNow);
            window.addEventListener('pagehide', saveNow);

            /* ---------- رجوع ---------- */
            $('backBtn').onclick = () => {
                try {
                    if (document.referrer && new URL(document.referrer).host === location.host && history.length > 1) { history.back(); return; }
                } catch (e) { }
                location.href = 'index.html';
            };

            /* ---------- ابدأ ---------- */
            renderPlayIcons();
            init();
        })();
    </script>
</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    <title>قارئ الملفات | ابن القائد</title>
    <link rel="icon" type="image/png" href="icons/son.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link rel="stylesheet" href="css/render.css">
</head>

<body>
    <div class="reader" id="reader">

        <div class="prog"><i id="progBar"></i></div>

        <div class="scroller" id="scroller" tabindex="0" aria-label="صفحات الملف">
            <div class="pages" id="pages"></div>
        </div>

        <div class="fb" id="fb"></div>

        <!-- الشريط العلوي -->
        <header class="top glass" id="top">
            <button class="ib" id="bBack" aria-label="رجوع"></button>
            <div class="ttl">
                <h1 id="docTitle">جاري التحميل…</h1>
                <span id="docSub">ابن القائد</span>
            </div>
            <button class="ib" id="bSearch" aria-label="بحث" disabled></button>
            <button class="ib" id="bThumbs" aria-label="الصفحات" disabled></button>
            <button class="ib" id="bNight" aria-label="الوضع الليلي"></button>
        </header>

        <!-- بحث -->
        <div class="search glass" id="search">
            <div class="srow">
                <div class="sbox">
                    <span id="icSearch"></span>
                    <input id="sInput" type="search" placeholder="ابحث داخل الملف" enterkeyhint="search" autocomplete="off">
                    <span class="scount" id="sCount"></span>
                </div>
                <button class="sbtn" id="sPrev" aria-label="النتيجة السابقة" disabled></button>
                <button class="sbtn" id="sNext" aria-label="النتيجة التالية" disabled></button>
                <button class="sbtn" id="sClose" aria-label="إغلاق"></button>
            </div>
            <div class="snote" id="sNote"></div>
        </div>

        <!-- dock -->
        <nav class="dock glass" id="dock">
            <button class="ib" id="bPrev" aria-label="الصفحة السابقة"></button>
            <button class="pg" id="pgBtn" aria-label="اذهب لصفحة"><span id="pgCur">1</span><em>/</em><em id="pgTot">1</em></button>
            <button class="ib" id="bNext" aria-label="الصفحة التالية"></button>
            <span class="sep"></span>
            <button class="ib" id="bZout" aria-label="تصغير"></button>
            <button class="zv" id="zVal" aria-label="ضبط على العرض">100%</button>
            <button class="ib" id="bZin" aria-label="تكبير"></button>
        </nav>

        <!-- الصفحات المصغّرة -->
        <div class="scrim" id="scrim"></div>
        <aside class="thumbs glass" id="thumbs" aria-label="الصفحات">
            <div class="thead"><span>الصفحات</span><button class="ib" id="tClose" aria-label="إغلاق"></button></div>
            <div class="tgrid" id="tgrid"></div>
        </aside>

        <div class="toast glass" id="toast"></div>

        <!-- تحميل / خطأ -->
        <div class="state" id="state">
            <div class="scard glass" id="scard"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/view-guard.js"></script>
<script src="js/render.js"></script>
</body>

</html>

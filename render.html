<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    <title>قارئ الملفات | ابن القائد</title>
    <link rel="icon" type="image/png" href="/son.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* ==========================================================
           TOKENS — iOS 26 Liquid Glass (نفس لغة المنصة)
        ========================================================== */
        :root {
            --font: "IBM Plex Sans Arabic", "SF Arabic", -apple-system, "Segoe UI", Cairo, Tahoma, system-ui, sans-serif;
            --accent: #0a84ff;
            --accent-soft: rgba(10, 132, 255, .2);
            --bg: #000;
            --desk: #050506;
            --hair: rgba(255, 255, 255, .11);
            --t1: #fff;
            --t2: rgba(255, 255, 255, .62);
            --t3: rgba(255, 255, 255, .4);
            --ease: cubic-bezier(.25, .8, .25, 1);

            --gl-bg: rgba(44, 44, 48, .55);
            --gl-brd: rgba(255, 255, 255, .15);
            --gl-hl: inset 0 1px 0 rgba(255, 255, 255, .26), inset 0 -1px 0 rgba(255, 255, 255, .04);
            --gl-sh: 0 10px 34px rgba(0, 0, 0, .45);
            --gl-t: #fff;
            --gl-t2: rgba(255, 255, 255, .6);
            --gl-hov: rgba(255, 255, 255, .13);
            --page-sh: 0 6px 28px rgba(0, 0, 0, .55);
            --skel: #e9e9ee;
        }

        body.light {
            --accent: #007aff;
            --accent-soft: rgba(0, 122, 255, .14);
            --bg: #f2f2f7;
            --desk: #e6e6ec;
            --hair: rgba(0, 0, 0, .09);
            --t1: #111114;
            --t2: rgba(17, 17, 20, .65);
            --t3: rgba(17, 17, 20, .42);

            --gl-bg: rgba(255, 255, 255, .62);
            --gl-brd: rgba(0, 0, 0, .08);
            --gl-hl: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(0, 0, 0, .03);
            --gl-sh: 0 10px 34px rgba(0, 0, 0, .14);
            --gl-t: #111114;
            --gl-t2: rgba(17, 17, 20, .55);
            --gl-hov: rgba(0, 0, 0, .07);
            --page-sh: 0 4px 22px rgba(0, 0, 0, .18);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--t1);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-text-size-adjust: 100%;
        }

        button {
            font-family: inherit;
            color: inherit;
            border: 0;
            background: none;
            cursor: pointer;
            touch-action: manipulation;
        }

        input {
            font-family: inherit;
        }

        svg {
            display: block;
            fill: currentColor;
        }

        @media print {
            body {
                display: none !important;
            }
        }

        /* ---------- زجاج ---------- */
        .glass {
            background: var(--gl-bg);
            border: 1px solid var(--gl-brd);
            box-shadow: var(--gl-hl), var(--gl-sh);
            -webkit-backdrop-filter: blur(28px) saturate(185%);
            backdrop-filter: blur(28px) saturate(185%);
            color: var(--gl-t);
        }

        .reader {
            position: fixed;
            inset: 0;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
        }

        /* ==========================================================
           الصفحات
        ========================================================== */
        .scroller {
            --top: calc(env(safe-area-inset-top) + 8px + 56px + 14px);
            position: absolute;
            inset: 0;
            overflow: auto;
            direction: ltr;
            padding: var(--top) 0 calc(env(safe-area-inset-bottom) + 12px + 56px + 28px);
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
            outline: none;
            scrollbar-width: thin;
            scrollbar-color: var(--t3) transparent;
        }

        .scroller::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .scroller::-webkit-scrollbar-thumb {
            background: var(--t3);
            border-radius: 8px;
        }

        .pages {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            will-change: transform;
        }

        .page {
            position: relative;
            flex: none;
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: var(--page-sh);
        }

        .page canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .page::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .7) 50%, transparent 70%) var(--skel);
            background-size: 220% 100%;
            animation: shimmer 1.4s linear infinite;
            transition: opacity .3s;
        }

        .page.ok::after {
            opacity: 0;
            pointer-events: none;
            animation: none;
        }

        @keyframes shimmer {
            from {
                background-position: 120% 0;
            }

            to {
                background-position: -120% 0;
            }
        }

        .reader.night .page {
            background: #1b1b1d;
        }

        .reader.night .page canvas {
            filter: invert(.93) hue-rotate(180deg);
        }

        .reader.night .page::after {
            --skel: #2a2a2d;
            background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .08) 50%, transparent 70%) #232326;
            background-size: 220% 100%;
        }

        .hl {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }

        .hl i {
            position: absolute;
            background: rgba(255, 214, 10, .45);
            border-radius: 3px;
            mix-blend-mode: multiply;
        }

        .hl i.cur {
            background: rgba(255, 149, 0, .6);
            outline: 2px solid rgba(255, 149, 0, .9);
        }

        .reader.night .hl i {
            mix-blend-mode: screen;
            background: rgba(255, 214, 10, .35);
        }

        /* ==========================================================
           الشريط العلوي
        ========================================================== */
        .top {
            position: fixed;
            z-index: 30;
            top: calc(env(safe-area-inset-top) + 8px);
            left: calc(10px + env(safe-area-inset-left));
            right: calc(10px + env(safe-area-inset-right));
            max-width: 1100px;
            margin-inline: auto;
            height: 56px;
            border-radius: 28px;
            padding: 0 7px;
            display: flex;
            align-items: center;
            gap: 6px;
            direction: rtl;
            transition: transform .4s var(--ease), opacity .3s var(--ease);
        }

        .ib {
            width: 44px;
            height: 44px;
            flex: none;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: var(--gl-t);
            transition: background .2s var(--ease), transform .15s var(--ease);
        }

        .ib:hover {
            background: var(--gl-hov);
        }

        .ib:active {
            transform: scale(.9);
        }

        .ib.on {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .ib svg {
            width: 22px;
            height: 22px;
        }

        .ib:disabled {
            opacity: .35;
            pointer-events: none;
        }

        .ttl {
            flex: 1;
            min-width: 0;
            padding: 0 4px;
        }

        .ttl h1 {
            font-size: clamp(.9rem, 2.6vw, 1.02rem);
            font-weight: 700;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ttl span {
            display: block;
            font-size: .72rem;
            color: var(--gl-t2);
            font-variant-numeric: tabular-nums;
        }

        .prog {
            position: fixed;
            z-index: 40;
            top: 0;
            right: 0;
            left: 0;
            height: 3px;
            pointer-events: none;
        }

        .prog i {
            display: block;
            height: 100%;
            width: 100%;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: right;
            border-radius: 0 0 3px 3px;
        }

        /* ==========================================================
           الـ dock السفلي
        ========================================================== */
        .dock {
            position: fixed;
            z-index: 30;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom) + 12px);
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 6px;
            border-radius: 999px;
            direction: rtl;
            max-width: calc(100% - 16px);
            transition: transform .4s var(--ease), opacity .3s var(--ease);
        }

        .pg {
            min-width: 84px;
            height: 44px;
            padding: 0 14px;
            border-radius: 999px;
            font-size: .95rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            direction: ltr;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: var(--gl-t);
            transition: background .2s;
        }

        .pg:hover {
            background: var(--gl-hov);
        }

        .pg em {
            font-style: normal;
            color: var(--gl-t2);
            font-weight: 500;
        }

        .pg input {
            width: 3.2ch;
            text-align: center;
            font-size: inherit;
            font-weight: 700;
            color: var(--gl-t);
            background: var(--accent-soft);
            border: 0;
            border-radius: 8px;
            outline: 2px solid var(--accent);
            padding: 2px 0;
            -moz-appearance: textfield;
            user-select: text;
            -webkit-user-select: text;
        }

        .pg input::-webkit-outer-spin-button,
        .pg input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .sep {
            width: 1px;
            height: 22px;
            background: var(--gl-brd);
            margin: 0 4px;
            flex: none;
        }

        .zv {
            display: none;
            min-width: 56px;
            height: 40px;
            border-radius: 999px;
            font-size: .84rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--gl-t2);
            direction: ltr;
        }

        .zv:hover {
            background: var(--gl-hov);
            color: var(--gl-t);
        }

        @media (min-width: 520px) {
            .zv {
                display: block;
            }
        }

        @media (max-width: 380px) {
            .ib {
                width: 40px;
                height: 40px;
            }

            .pg {
                min-width: 70px;
                padding: 0 8px;
            }
        }

        /* إخفاء الواجهة أثناء القراءة (لمس فقط) */
        .reader.off .top {
            transform: translateY(calc(-100% - 24px));
            opacity: 0;
        }

        .reader.off .dock {
            transform: translate(-50%, calc(100% + 30px));
            opacity: 0;
        }

        /* ==========================================================
           البحث
        ========================================================== */
        .search {
            position: fixed;
            z-index: 35;
            top: calc(env(safe-area-inset-top) + 8px + 56px + 8px);
            left: 50%;
            width: min(560px, calc(100% - 20px));
            transform: translate(-50%, -10px) scale(.97);
            transform-origin: top center;
            border-radius: 24px;
            padding: 8px;
            direction: rtl;
            opacity: 0;
            visibility: hidden;
            transition: opacity .22s var(--ease), transform .22s var(--ease), visibility .22s;
        }

        .search.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        .srow {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sbox {
            flex: 1;
            min-width: 0;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            border-radius: 999px;
            background: var(--gl-hov);
        }

        .sbox svg {
            width: 18px;
            height: 18px;
            color: var(--gl-t2);
            flex: none;
        }

        .sbox input {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: none;
            border: 0;
            outline: 0;
            color: var(--gl-t);
            font-size: 16px;
            user-select: text;
            -webkit-user-select: text;
        }

        .sbox input::placeholder {
            color: var(--gl-t2);
        }

        .scount {
            font-size: .78rem;
            color: var(--gl-t2);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            direction: rtl;
        }

        .sbtn {
            width: 38px;
            height: 38px;
            flex: none;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: var(--gl-t);
        }

        .sbtn:hover {
            background: var(--gl-hov);
        }

        .sbtn:disabled {
            opacity: .3;
        }

        .sbtn svg {
            width: 18px;
            height: 18px;
        }

        .snote {
            font-size: .74rem;
            color: var(--gl-t2);
            padding: 6px 10px 2px;
            min-height: 0;
        }

        .snote:empty {
            display: none;
        }

        /* ==========================================================
           الصفحات المصغّرة
        ========================================================== */
        .scrim {
            position: fixed;
            inset: 0;
            z-index: 44;
            background: rgba(0, 0, 0, .35);
            opacity: 0;
            visibility: hidden;
            transition: opacity .3s, visibility .3s;
        }

        .scrim.on {
            opacity: 1;
            visibility: visible;
        }

        .thumbs {
            position: fixed;
            z-index: 45;
            top: calc(env(safe-area-inset-top) + 8px);
            bottom: calc(env(safe-area-inset-bottom) + 8px);
            right: calc(8px + env(safe-area-inset-right));
            width: min(330px, calc(100% - 16px));
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            direction: rtl;
            transform: translateX(calc(100% + 20px));
            transition: transform .4s var(--ease);
            overflow: hidden;
        }

        .thumbs.open {
            transform: none;
        }

        .thead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 12px 6px 14px;
            padding-inline-start: 18px;
            font-weight: 700;
            font-size: 1rem;
        }

        .tgrid {
            flex: 1;
            overflow: auto;
            padding: 8px 14px 18px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px 12px;
            align-content: start;
            overscroll-behavior: contain;
            scrollbar-width: none;
        }

        .tgrid::-webkit-scrollbar {
            display: none;
        }

        .th {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: .78rem;
            color: var(--gl-t2);
            font-variant-numeric: tabular-nums;
        }

        .th .box {
            position: relative;
            width: 100%;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            outline: 2px solid transparent;
            outline-offset: 2px;
            transition: outline-color .2s;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .3);
        }

        .th.cur .box {
            outline-color: var(--accent);
        }

        .th.cur {
            color: var(--accent);
            font-weight: 700;
        }

        .th canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ==========================================================
           تحميل / خطأ / toast
        ========================================================== */
        .state {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(110% 80% at 50% 0%, rgba(10, 132, 255, .22), transparent 60%),
                radial-gradient(90% 70% at 90% 100%, rgba(94, 92, 230, .16), transparent 60%),
                var(--bg);
            transition: opacity .4s var(--ease), visibility .4s;
        }

        .state.off {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .scard {
            width: min(340px, 100%);
            border-radius: 30px;
            padding: 26px 22px 22px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .scard h2 {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.5;
        }

        .scard p {
            font-size: .84rem;
            color: var(--gl-t2);
            line-height: 1.7;
        }

        .ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), var(--gl-hov) 0);
            position: relative;
        }

        .ring::before {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: var(--bg);
        }

        .ring b {
            position: relative;
            font-size: .85rem;
            font-variant-numeric: tabular-nums;
        }

        .ring.spin {
            background: conic-gradient(from 0deg, var(--accent) 0 25%, var(--gl-hov) 0);
            animation: rot 1s linear infinite;
        }

        .ring.spin b {
            display: none;
        }

        @keyframes rot {
            to {
                transform: rotate(360deg);
            }
        }

        .eic {
            width: 52px;
            height: 52px;
            color: #ff6961;
        }

        .pill {
            margin-top: 6px;
            padding: 11px 26px;
            border-radius: 999px;
            font-weight: 600;
            font-size: .92rem;
            background: var(--accent);
            color: #fff;
        }

        .toast {
            position: fixed;
            z-index: 60;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom) + 12px + 56px + 16px);
            transform: translate(-50%, 12px);
            padding: 9px 18px;
            border-radius: 999px;
            font-size: .84rem;
            font-weight: 600;
            direction: rtl;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s var(--ease), transform .25s var(--ease);
        }

        .toast.on {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ---------- وضع بديل (Google Drive preview) ---------- */
        .fb {
            position: absolute;
            inset: 0;
            display: none;
            padding: var(--fbtop, 80px) 0 0;
            background: #fff;
        }

        .reader.fallback .fb {
            display: block;
        }

        .reader.fallback .scroller,
        .reader.fallback .dock,
        .reader.fallback #bSearch,
        .reader.fallback #bThumbs,
        .reader.fallback #bNight {
            display: none;
        }

        .fb iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .fb .blk {
            position: absolute;
            top: calc(var(--fbtop, 80px));
            right: 0;
            width: 76px;
            height: 70px;
            z-index: 3;
        }

        .fb .wmv {
            position: absolute;
            inset: var(--fbtop, 80px) 0 0 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
        }

        .fb .wmv i {
            position: absolute;
            font-style: normal;
            font-weight: 700;
            font-size: 1rem;
            color: rgba(80, 80, 80, .28);
            transform: rotate(-20deg);
            white-space: nowrap;
            transition: left 1.6s var(--ease), top 1.6s var(--ease);
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="reader" id="reader">

        <div class="prog"><i id="progBar"></i></div>

        <div class="scroller" id="scroller" tabindex="0" aria-label="صفحات الملف">
            <div class="pages" id="pages"></div>
        </div>

        <div class="fb" id="fb"></div>

        <!-- الشريط العلوي -->
        <header class="top glass" id="top">
            <button class="ib" id="bBack" aria-label="رجوع"></button>
            <div class="ttl">
                <h1 id="docTitle">جاري التحميل…</h1>
                <span id="docSub">ابن القائد</span>
            </div>
            <button class="ib" id="bSearch" aria-label="بحث" disabled></button>
            <button class="ib" id="bThumbs" aria-label="الصفحات" disabled></button>
            <button class="ib" id="bNight" aria-label="الوضع الليلي"></button>
        </header>

        <!-- بحث -->
        <div class="search glass" id="search">
            <div class="srow">
                <div class="sbox">
                    <span id="icSearch"></span>
                    <input id="sInput" type="search" placeholder="ابحث داخل الملف" enterkeyhint="search" autocomplete="off">
                    <span class="scount" id="sCount"></span>
                </div>
                <button class="sbtn" id="sPrev" aria-label="النتيجة السابقة" disabled></button>
                <button class="sbtn" id="sNext" aria-label="النتيجة التالية" disabled></button>
                <button class="sbtn" id="sClose" aria-label="إغلاق"></button>
            </div>
            <div class="snote" id="sNote"></div>
        </div>

        <!-- dock -->
        <nav class="dock glass" id="dock">
            <button class="ib" id="bPrev" aria-label="الصفحة السابقة"></button>
            <button class="pg" id="pgBtn" aria-label="اذهب لصفحة"><span id="pgCur">1</span><em>/</em><em id="pgTot">1</em></button>
            <button class="ib" id="bNext" aria-label="الصفحة التالية"></button>
            <span class="sep"></span>
            <button class="ib" id="bZout" aria-label="تصغير"></button>
            <button class="zv" id="zVal" aria-label="ضبط على العرض">100%</button>

                        const resp = await fetch(sg.data.signedUrl);
                        if (!resp.ok) throw new Error('denied');
                        pdfData = new Uint8Array(await resp.arrayBuffer());
                    } catch (e) { showError('معندكش صلاحية فتح الملف ده. لو المشاهدات خلصت اشترك من جديد.', true); return; }
                }
                try {
                    const task = pdfjsLib.getDocument({
                        ...(pdfData ? { data: pdfData } : { url, withCredentials: false }),
                        cMapUrl: PDFJS_BASE + 'cmaps/', cMapPacked: true,
                        standardFontDataUrl: PDFJS_BASE + 'standard_fonts/',
                        isEvalSupported: false
                    });
                    task.onProgress = p => { if (p.total) setProgress(Math.min(95, p.loaded / p.total * 95), 'جاري التحميل…'); };
                    doc = await task.promise;
                } catch (e) {
                    if (gid) { fallbackDrive(gid); return; }
                    const name = (e && e.name) || '';
                    showError(name === 'PasswordException' ? 'الملف ده محمي بكلمة سر.' : 'الملف مش بيتحمّل حاليًا. جرّب تاني بعد شوية.');
                    return;
                }

                N = doc.numPages;
                $('pgTot').textContent = N;
                setProgress(96, 'جاري تجهيز الصفحات…');

                // أبعاد الصفحات
                sizes = new Array(N); R = new Array(N);
                const limit = N > 400 ? 20 : N;
                for (let s = 0; s < limit; s += 25) {
                    const part = [];
                    for (let i = s; i < Math.min(limit, s + 25); i++) part.push(doc.getPage(i + 1).then(p => { const v = p.getViewport({ scale: 1 }); sizes[i] = { w: v.width, h: v.height }; R[i] = { page: p }; }));
                    await Promise.all(part);
                }
                for (let i = limit; i < N; i++) { sizes[i] = sizes[0]; R[i] = {}; }

                const frag = document.createDocumentFragment();
                for (let i = 0; i < N; i++) {
                    const el = document.createElement('div'); el.className = 'page'; el.dataset.i = i;
                    const hl = document.createElement('div'); hl.className = 'hl';
                    el.appendChild(hl);
                    R[i].el = el; R[i].hl = hl; R[i].key = null; tops[i] = 0; hts[i] = 0;
                    frag.appendChild(el);
                }
                pagesEl.appendChild(frag);
                layout();

                let start = 0;
                try { start = parseInt(localStorage.getItem(POS_KEY) || '0', 10) || 0; } catch (e) { }
                if (start > 0 && start < N) { goPage(start, false); toast('كملنا من صفحة ' + (start + 1)); }
                onScroll(true);

                $('bSearch').disabled = false; $('bThumbs').disabled = false;
                hideState();
                scroller.focus({ preventScroll: true });
            }

            /* ---------- وضع بديل لـ Google Drive (من غير API key) ---------- */
            function fallbackDrive(id) {
                reader.classList.add('fallback');
                const fb = $('fb');
                fb.style.setProperty('--fbtop', (document.getElementById('top').getBoundingClientRect().bottom + 8) + 'px');
                fb.innerHTML = '<iframe src="https://drive.google.com/file/d/' + id + '/preview" allow="autoplay" referrerpolicy="no-referrer" tabindex="-1"></iframe><div class="blk"></div><div class="wmv" id="wmv"></div>';
                const w = $('wmv');
                const nodes = [0, 1, 2].map(() => { const i = document.createElement('i'); i.textContent = WM_TEXT; w.appendChild(i); return i; });
                const place = () => nodes.forEach(n => { n.style.left = (5 + Math.random() * 60) + '%'; n.style.top = (8 + Math.random() * 78) + '%'; });
                place(); setInterval(place, 8000);
                hideState();
            }

            /* ======================================================
               أزرار التنقل
            ====================================================== */
            $('bPrev').onclick = () => goPage(curPage - 1, true);
            $('bNext').onclick = () => goPage(curPage + 1, true);
            $('bZin').onclick = () => stepZoom(1);
            $('bZout').onclick = () => stepZoom(-1);
            $('zVal').onclick = () => { zoomTo(1); toast('ضبط على العرض'); };
            $('bNight').onclick = () => {
                reader.classList.toggle('night');
                try { localStorage.setItem('pr_night', reader.classList.contains('night') ? '1' : '0'); } catch (e) { }
                setNightIcon();
            };
            $('bBack').onclick = () => {
                try { if (document.referrer && new URL(document.referrer).host === location.host && history.length > 1) { history.back(); return; } } catch (e) { }
                location.href = 'index.html';
            };

            // القفز لصفحة
            $('pgBtn').onclick = () => {
                const b = $('pgBtn'); if (b.querySelector('input')) return;
                const inp = document.createElement('input'); inp.type = 'number'; inp.min = 1; inp.max = N; inp.value = curPage + 1; inp.inputMode = 'numeric';
                const cur = $('pgCur'); cur.style.display = 'none'; b.insertBefore(inp, cur);
                inp.focus(); inp.select();
                const done = go => {
                    const v = parseInt(inp.value, 10);
                    inp.remove(); cur.style.display = '';
                    if (go && v >= 1 && v <= N) goPage(v - 1, true);
                };
                inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') done(true); else if (e.key === 'Escape') done(false); };
                inp.onblur = () => done(true);
            };

            /* ======================================================
               اللمس: pinch + double-tap + إظهار/إخفاء
            ====================================================== */
            let pin = null;
            const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            scroller.addEventListener('touchstart', e => {
                if (e.touches.length === 2) {
                    const a = e.touches[0], b = e.touches[1], rect = scroller.getBoundingClientRect();
                    const cx = (a.clientX + b.clientX) / 2 - rect.left, cy = (a.clientY + b.clientY) / 2 - rect.top;
                    pin = { d: dist(a, b), cx, cy, r: 1 };
                    pagesEl.style.transformOrigin = (scroller.scrollLeft + cx) + 'px ' + (scroller.scrollTop + cy - pagesEl.offsetTop) + 'px';
                }
            }, { passive: true });
            scroller.addEventListener('touchmove', e => {
                if (pin && e.touches.length === 2) {
                    e.preventDefault();
                    let r = dist(e.touches[0], e.touches[1]) / pin.d;
                    r = Math.max(MINZ / z, Math.min(MAXZ / z, r));
                    pin.r = r; pagesEl.style.transform = 'scale(' + r + ')';
                }
            }, { passive: false });
            const endPinch = e => {
                if (pin && e.touches.length < 2) {
                    const p = pin; pin = null;
                    pagesEl.style.transform = ''; pagesEl.style.transformOrigin = '';
                    zoomTo(z * p.r, p.cx, p.cy);
                }
            };
            scroller.addEventListener('touchend', endPinch, { passive: true });
            scroller.addEventListener('touchcancel', endPinch, { passive: true });
            ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

            // ctrl + عجلة الماوس = zoom
            scroller.addEventListener('wheel', e => {
                if (!(e.ctrlKey || e.metaKey)) return;
                e.preventDefault();
                const rect = scroller.getBoundingClientRect();
                zoomTo(z * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX - rect.left, e.clientY - rect.top);
            }, { passive: false });

            // نقرة واحدة (إظهار/إخفاء) ونقرتين (zoom)
            let lastTap = 0, tapT = null, lx = 0, ly = 0;
            scroller.addEventListener('click', e => {
                if (!N) return;
                const now = Date.now(), rect = scroller.getBoundingClientRect();
                const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
                if (now - lastTap < 300 && Math.hypot(cx - lx, cy - ly) < 40) {
                    clearTimeout(tapT); lastTap = 0;
                    zoomTo(z > 1.2 ? 1 : 2, cx, cy);
                    return;
                }
                lastTap = now; lx = cx; ly = cy;
                closePanels();
                if (coarse) tapT = setTimeout(() => reader.classList.toggle('off'), 290);
            });

            /* ======================================================
               الصفحات المصغّرة
            ====================================================== */
            const thumbs = $('thumbs'), scrim = $('scrim'), tgrid = $('tgrid');
            let thumbsBuilt = false;
            const tq = []; let tbusy = false;
            const panelOpen = () => thumbs.classList.contains('open') || $('search').classList.contains('open');

            function buildThumbs() {
                if (thumbsBuilt) return; thumbsBuilt = true;
                const io = new IntersectionObserver(es => {
                    es.forEach(en => { if (en.isIntersecting) { io.unobserve(en.target); tq.push(en.target); thumbPump(); } });
                }, { root: tgrid, rootMargin: '200px 0px' });
                for (let i = 0; i < N; i++) {
                    const d = document.createElement('button'); d.className = 'th'; d.dataset.i = i; d.setAttribute('aria-label', 'صفحة ' + (i + 1));
                    d.innerHTML = '<div class="box"></div><span>' + (i + 1) + '</span>';
                    d.firstChild.style.aspectRatio = sizes[i].w + ' / ' + sizes[i].h;
                    d.onclick = () => { goPage(i, false); if (window.innerWidth < 760) closePanels(); };
                    tgrid.appendChild(d); io.observe(d);
                }
                markThumb();
            }
            async function thumbPump() {
                if (tbusy) return; tbusy = true;
                while (tq.length) {
                    const d = tq.shift(), i = +d.dataset.i;
                    try {
                        const page = R[i].page || (R[i].page = await doc.getPage(i + 1));
                        const bw = d.firstChild.clientWidth || 140;
                        const vp = page.getViewport({ scale: bw * dpr / sizes[i].w });
                        const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
                        await page.render({ canvasContext: c.getContext('2d', { alpha: false }), viewport: vp, background: '#ffffff' }).promise;
                        d.firstChild.appendChild(c);
                    } catch (e) { }
                }
                tbusy = false;
            }
            let lastMark = -1;
            function markThumb() {
                if (!thumbsBuilt || lastMark === curPage) return;
                lastMark = curPage;
                const prev = tgrid.querySelector('.th.cur'); if (prev) prev.classList.remove('cur');
                const el = tgrid.children[curPage]; if (el) { el.classList.add('cur'); if (thumbs.classList.contains('open')) el.scrollIntoView({ block: 'nearest' }); }
            }
            function openThumbs() { buildThumbs(); closeSearch(); thumbs.classList.add('open'); scrim.classList.add('on'); $('bThumbs').classList.add('on'); reader.classList.remove('off'); const el = tgrid.children[curPage]; if (el) setTimeout(() => el.scrollIntoView({ block: 'center' }), 60); }
            function closeThumbs() { thumbs.classList.remove('open'); scrim.classList.remove('on'); $('bThumbs').classList.remove('on'); }
            $('bThumbs').onclick = () => thumbs.classList.contains('open') ? closeThumbs() : openThumbs();
            $('tClose').onclick = closeThumbs; scrim.onclick = closeThumbs;

            /* ======================================================
               البحث
            ====================================================== */
            const sInput = $('sInput');
            let pageTxt = [], indexed = 0, indexing = false, anyText = false;
            let hits = [], hitK = -1, searchT = null;
            const AR = '٠١٢٣٤٥٦٧٨٩';
            const norm = s => s.replace(/[\u064B-\u065F\u0670\u0640\u200c-\u200f]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/\s+/g, ' ').toLowerCase();

            async function buildIndex() {
                if (indexing || indexed >= N) return;
                indexing = true;
                for (let i = indexed; i < N; i++) {
                    try {
                        const page = R[i].page || (R[i].page = await doc.getPage(i + 1));
                        const tc = await page.getTextContent();
                        const items = tc.items.filter(it => typeof it.str === 'string' && it.str.length);
                        let joined = '', st = [], ns = [];
                        items.forEach(it => { const n = norm(it.str); st.push(joined.length); ns.push(n); joined += n + ' '; });
                        if (joined.trim()) anyText = true;
                        pageTxt[i] = { items, st, ns, joined };
                    } catch (e) { pageTxt[i] = { items: [], st: [], ns: [], joined: '' }; }
                    indexed = i + 1;
                    if (i % 8 === 0) {
                        if ($('search').classList.contains('open') && indexed < N) $('sNote').textContent = 'جاري تجهيز البحث… ' + Math.round(indexed / N * 100) + '%';
                        await new Promise(r => setTimeout(r, 0));
                        if (sInput.value.trim().length > 1 && i % 24 === 0) runSearch(true);
                    }
                }
                indexing = false;
                $('sNote').textContent = anyText ? '' : 'الملف ده صور (مسحوب ضوئيًا) فالبحث النصي مش متاح.';
                if (sInput.value.trim().length > 1) runSearch(true);
            }

            function runSearch(keep) {
                const q = norm(sInput.value.trim());
                const prevHit = hits[hitK];
                hits = [];
                if (q.length > 1) {
                    for (let i = 0; i < indexed && hits.length < 800; i++) {
                        const j = pageTxt[i] && pageTxt[i].joined; if (!j) continue;
                        let p = 0;
                        while ((p = j.indexOf(q, p)) >= 0) { hits.push({ p: i, a: p, b: p + q.length }); p += q.length; if (hits.length >= 800) break; }
                    }
                }
                if (keep && prevHit) { const k = hits.findIndex(h => h.p === prevHit.p && h.a === prevHit.a); hitK = k >= 0 ? k : Math.min(hitK, hits.length - 1); }
                else { hitK = hits.length ? Math.max(0, hits.findIndex(h => h.p >= curPage)) : -1; if (hits.length && hitK < 0) hitK = 0; }
                updateCount();
                for (let i = 0; i < N; i++) if (R[i].canvas) drawHL(i);
                if (!keep && hitK >= 0) focusHit();
            }
            function updateCount() {
                const has = hits.length > 0;
                $('sCount').textContent = sInput.value.trim().length < 2 ? '' : (has ? (hitK + 1) + ' / ' + hits.length : 'لا نتائج');
                $('sPrev').disabled = $('sNext').disabled = !has;
            }
            function rectsFor(h, vp) {
                const pt = pageTxt[h.p]; if (!pt) return [];
                const out = [];
                for (let k = 0; k < pt.items.length; k++) {
                    const s0 = pt.st[k], e0 = s0 + pt.ns[k].length;
                    if (e0 <= h.a || s0 >= h.b || !pt.ns[k].length) continue;
                    const len = pt.ns[k].length;
                    const f0 = (Math.max(h.a, s0) - s0) / len, f1 = (Math.min(h.b, e0) - s0) / len;
                    const it = pt.items[k];
                    const t = pdfjsLib.Util.transform(vp.transform, it.transform);
                    const w = it.width * vp.scale, fh = Math.hypot(t[2], t[3]);
                    const rtl = it.dir === 'rtl';
                    const left = t[4] + (rtl ? w * (1 - f1) : w * f0);
                    out.push({ x: left, y: t[5] - fh * 0.92, w: Math.max(3, w * (f1 - f0)), h: fh * 1.15 });
                }
                return out;
            }
            function drawHL(i) {
                const rec = R[i]; if (!rec.hl) return;
                rec.hl.innerHTML = '';
                if (!hits.length || !rec.page) return;
                const cssW = Math.round(availW * z);
                const vp = rec.page.getViewport({ scale: cssW / sizes[i].w });
                hits.forEach((h, idx) => {
                    if (h.p !== i) return;
                    rectsFor(h, vp).forEach(r => {
                        const d = document.createElement('i');
                        d.style.cssText = 'left:' + r.x + 'px;top:' + r.y + 'px;width:' + r.w + 'px;height:' + r.h + 'px';
                        if (idx === hitK) d.className = 'cur';
                        rec.hl.appendChild(d);
                    });
                });
            }
            function focusHit() {
                const h = hits[hitK]; if (!h) return;
                const rec = R[h.p];
                const cssW = Math.round(availW * z);
                const vp = rec.page.getViewport({ scale: cssW / sizes[h.p].w });
                const rs = rectsFor(h, vp);
                const y = rs.length ? rs[0].y : 0;
                const x = rs.length ? rs[0].x : 0;
                scroller.scrollTo({ top: tops[h.p] + y - scroller.clientHeight / 3, left: z > 1.05 ? Math.max(0, rec.el.offsetLeft + x - scroller.clientWidth / 2) : scroller.scrollLeft, behavior: 'smooth' });
                for (let i = 0; i < N; i++) if (R[i].canvas) drawHL(i);
            }
            function stepHit(d) { if (!hits.length) return; hitK = (hitK + d + hits.length) % hits.length; updateCount(); focusHit(); }

            function openSearch() {
                closeThumbs(); $('search').classList.add('open'); $('bSearch').classList.add('on'); reader.classList.remove('off');
                buildIndex(); setTimeout(() => { sInput.focus(); sInput.select(); }, 120);
            }
            function closeSearch() {
                $('search').classList.remove('open'); $('bSearch').classList.remove('on'); sInput.blur();
                hits = []; hitK = -1; updateCount();
                for (let i = 0; i < N; i++) if (R[i] && R[i].hl) R[i].hl.innerHTML = '';
            }
            function closePanels() { closeThumbs(); if ($('search').classList.contains('open')) closeSearch(); }
            $('bSearch').onclick = () => $('search').classList.contains('open') ? closeSearch() : openSearch();
            $('sClose').onclick = closeSearch;
            $('sPrev').onclick = () => stepHit(-1);
            $('sNext').onclick = () => stepHit(1);
            sInput.addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(() => runSearch(false), 220); });
            sInput.addEventListener('keydown', e => {
                e.stopPropagation();
                if (e.key === 'Enter') { e.preventDefault(); stepHit(e.shiftKey ? -1 : 1); }
                else if (e.key === 'Escape') closeSearch();
            });

            /* ======================================================
               كيبورد
            ====================================================== */
            document.addEventListener('keydown', e => {
                if (!N) return;
                const c = e.ctrlKey || e.metaKey, k = e.key;
                if (c && (k === 'f' || k === 'F')) { e.preventDefault(); openSearch(); return; }
                if (c && (k === '+' || k === '=')) { e.preventDefault(); stepZoom(1); return; }
                if (c && k === '-') { e.preventDefault(); stepZoom(-1); return; }
                if (c && k === '0') { e.preventDefault(); zoomTo(1); return; }
                if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
                if (k === 'Escape') { closePanels(); return; }
                if (k === '/') { e.preventDefault(); openSearch(); return; }
                if (k === '+' || k === '=') { stepZoom(1); return; }
                if (k === '-') { stepZoom(-1); return; }
                if (k === 'Home') { e.preventDefault(); goPage(0, true); return; }
                if (k === 'End') { e.preventDefault(); goPage(N - 1, true); return; }
                if (z <= 1.05 && k === 'ArrowLeft') { e.preventDefault(); goPage(curPage + 1, true); return; }
                if (z <= 1.05 && k === 'ArrowRight') { e.preventDefault(); goPage(curPage - 1, true); return; }
                if (k === 'n' || k === 'N') { $('bNight').click(); }
            });

            /* ======================================================
               تغيير الحجم / تدوير الشاشة
            ====================================================== */
            let rsT = null, lastSW = 0;
            new ResizeObserver(() => {
                const w = scroller.clientWidth;
                if (!N || !lastSW) { lastSW = w; return; }
                if (w === lastSW) { onScroll(true); return; }
                lastSW = w;
                clearTimeout(rsT);
                rsT = setTimeout(() => layout(pageAnchor()), 120);
            }).observe(scroller);
            // أثناء السحب السريع نضمن الرسم
            window.addEventListener('orientationchange', () => setTimeout(() => N && layout(pageAnchor()), 350));

            /* ======================================================
               حماية (طبقة ردع — الحماية الحقيقية على السيرفر)
            ====================================================== */
            document.addEventListener('contextmenu', e => { if (!(e.target && e.target.tagName === 'INPUT')) e.preventDefault(); });
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('copy', e => { if (!(e.target && e.target.tagName === 'INPUT')) e.preventDefault(); });
            document.addEventListener('keydown', e => {
                const c = e.ctrlKey || e.metaKey, s = e.shiftKey, k = (e.key || '').toUpperCase();
                if (e.key === 'F12' || (c && ['U', 'S', 'P'].includes(k)) || (c && s && ['I', 'J', 'C'].includes(k))) {
                    e.preventDefault(); e.stopPropagation(); toast('الإجراء ده غير مسموح');
                }
            }, true);
            window.addEventListener('beforeprint', () => { document.body.style.display = 'none'; });
            window.addEventListener('afterprint', () => { document.body.style.display = ''; });
            const fine = window.matchMedia('(pointer:fine)');
            setInterval(() => {
                if (!fine.matches) return;
                const open = (window.outerWidth - window.innerWidth > 220) || (window.outerHeight - window.innerHeight > 260);
                pagesEl.style.filter = open ? 'blur(26px)' : '';
            }, 1000);
            window.addEventListener('pagehide', () => { try { localStorage.setItem(POS_KEY, String(curPage)); } catch (e) { } });

            VG.gate(ctx, {
                notify: toast,
                kick: () => { try { doc && doc.destroy && doc.destroy(); } catch (e) { } try { pagesEl.innerHTML = ''; } catch (e) { } }
            }).then(ok => { if (ok) open(); });
        })();
    </script>
</body>

</html>
